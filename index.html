<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRAP ARGENTINO 24/7 - EN VIVO</title>
  <style>
    body,html{margin:0;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif;position:relative;}
    video{width:100vw;height:100vh;object-fit:contain;background:#000;}
    .live{position:absolute;top:15px;left:15px;background:#c00;color:#fff;padding:10px 25px;border-radius:50px;font-weight:bold;z-index:10;animation:p 2s infinite;letter-spacing:1px;}
    @keyframes p{0%,100%{opacity:0.75}50%{opacity:1}}
    .clock,.views,.title{position:absolute;background:rgba(0,0,0,0.65);color:#fff;padding:10px 18px;border-radius:8px;z-index:10;backdrop-filter:blur(6px);}
    .clock{top:15px;right:15px;font-size:20px;}
    .views{bottom:15px;right:15px;font-size:18px;}
    .title{bottom:15px;left:15px;font-size:18px;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    #playBtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#c00;color:#fff;font-size:36px;padding:30px 70px;border:none;border-radius:30px;cursor:pointer;z-index:100;box-shadow:0 15px 50px rgba(0,0,0,0.8);animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1)}}
  </style>
</head>
<body>

  <div class="live">EN VIVO 24/7 ●</div>
  <div class="clock" id="clock"></div>
  <div class="views">Espectadores: <span id="views">73.892</span></div>
  <div class="title" id="title">Cargando transmisión en vivo...</div>

  <button id="playBtn">PLAY</button>

  <video id="video" playsinline preload="auto"></video>

  <script>
    // === TU PLAYLIST (poné 30–60 temas acá y es indetectable) ===
    const videos = [
      {url: "https://ia800506.us.archive.org/31/items/x-2-download.app-ulises-bueno-rusherking-big-one-mentiras-crossover/X2Download.app-UlisesBueno%2CRusherking%2CBigOne-Mentiras_CROSSOVER.mp4", titulo: "Ulises Bueno, Rusherking, Big One - Mentiras"},
      {url: "https://ia800508.us.archive.org/28/items/y-2mate.com-urba-y-rome-x-alex-rose-x-lyanno-publico-video-lyric-720p/y2mate.com%20-%20Urba%20y%20Rome%20x%20Alex%20Rose%20x%20Lyanno%20%20P%C3%BAblico%20Video%20Lyric_720p.mp4", titulo: "Urba y Rome, Alex Rose, Lyanno - Público"},
      {url: "https://ia600507.us.archive.org/20/items/y-2mate.com-cabana-el-jordan-23-ft-ugly-duck-prod-by-nes-on-the-shet-video-official-720p/y2mate.com%20-%20CABANA%20%20El%20Jordan%2023%20Ft%20Ugly%20Duck%20Prod%20By%20NesOnTheShet%20Video%20Official_720p.mp4", titulo: "El Jordan 23 ft. Ugly Duck - Cabana"},
      {url: "https://ia801009.us.archive.org/16/items/roa-hades-66-ppc-official-video/ROA%2C%20Hades66%20-%20PPC%20%28Official%20Video%29.ia.mp4", titulo: "ROA, Hades66 - PPC"},
      // PEGÁ TODOS LOS DEMÁS ACÁ
    ];

    const video = document.getElementById("video");
    const playBtn = document.getElementById("playBtn");
    video.controls = false;

    let ultimo = -1;

    // Aleatorio REAL (puede repetir, como en la radio de verdad)
    function temaRandom() {
      let i;
      do { i = Math.floor(Math.random() * videos.length); }
      while (i === ultimo && videos.length > 1);
      ultimo = i;
      return i;
    }

    function reproducir() {
      const i = temaRandom();
      video.src = videos[i].url;
      document.getElementById("title").textContent = "Ahora: " + videos[i].titulo;

      video.onloadedmetadata = () => {
        video.currentTime = 0;
        video.play();
      };

      video.onended = reproducir;
    }

    playBtn.onclick = playBtn.ontouchstart = () => {
      playBtn.style.display = "none";
      video.muted = false;
      video.volume = 1;
      reproducir();
    };

    // Reloj y viewers ultra reales
    setInterval(() => {
      document.getElementById("clock").textContent = new Date().toLocaleTimeString("es-ES", {hour12:false});
    }, 1000);

    setInterval(() => {
      const h = new Date().getHours();
      let base = (h >= 21 || h <= 8) ? 95000 : 35000;
      const variacion = Math.floor(Math.random() * 60000) - 30000;
      const viewers = Math.max(25000, base + variacion);
      document.getElementById("views").textContent = viewers.toLocaleString("es-ES");
    }, 20000);

  </script>
</body>
</html>
